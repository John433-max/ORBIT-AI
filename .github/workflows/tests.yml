name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Install API extras (serve)
        run: |
          if [ -f requirements-api.txt ]; then
            pip install -r requirements-api.txt
          else
            pip install "fastapi>=0.110" "uvicorn>=0.27" "httpx>=0.27"
          fi
          python -c "import fastapi, uvicorn; print('api deps ok', fastapi.__version__)"

      - name: Unit tests (always)
        run: |
          python -m pytest --version
          if [ -d tests/unit ]; then
            PYTHONPATH=. python -m pytest tests/unit -q --tb=short --maxfail=8
          else
            echo "No tests/unit yet — skip"
          fi

      - name: Agent tests (if present)
        run: |
          if [ -f test_agents.py ]; then
            PYTHONPATH=. python -m pytest test_agents.py -q --tb=line
          else
            echo "test_agents.py not in this checkout — skip (upload full source zip)"
          fi

      - name: Import smoke (if modules present)
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib
          for m in ("orbit.core.config", "orbit.models.echo", "orbit.models.router"):
              try:
                  importlib.import_module(m)
                  print("ok", m)
              except Exception as e:
                  print("skip", m, e)
          PY

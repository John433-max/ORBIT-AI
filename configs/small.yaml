# ORBIT small configuration
model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  n_kv_heads: 4
  context_length: 256
  vocab_size: 3000
  ffn_multiplier: 2.6666666666666665
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true
training:
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0003
  max_steps: 2000
  lr_scheduler: cosine
runtime:
  device: cpu
  dtype: float32

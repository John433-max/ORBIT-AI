<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBIT</title>
  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --surface: #2f2f2f;
      --surface-2: #3a3a3a;
      --border: #444;
      --text: #ececec;
      --muted: #9b9b9b;
      --accent: #10a37f;
      --accent-hover: #0d8c6d;
      --user-bg: #2f2f2f;
      --assistant-bg: transparent;
      --danger: #ef4444;
      --radius: 1.25rem;
      --font: "Söhne", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* —— Sidebar —— */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 0.75rem;
      gap: 0.5rem;
    }
    .sidebar .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.65rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10a37f, #3b82f6);
      display: grid; place-items: center;
      font-size: 0.85rem; font-weight: 700; color: #fff;
    }
    .btn-new {
      width: 100%;
      text-align: left;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid #333;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-new:hover { background: #222; }
    .sidebar-section {
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid #2a2a2a;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .sidebar-section label {
      font-size: 0.7rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sidebar-section select,
    .sidebar-section input[type="text"],
    .sidebar-section textarea {
      width: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.55rem;
      font: inherit;
      font-size: 0.85rem;
    }
    .sidebar-section textarea { resize: vertical; min-height: 64px; }
    .toggle {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: var(--muted);
    }
    .toggle input { accent-color: var(--accent); }

    /* —— Main —— */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .topbar h1 {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
    }
    .health {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #333;
      color: var(--muted);
    }
    .health.ok { color: var(--accent); border-color: #1a4a3a; }
    .health.err { color: var(--danger); border-color: #4a1a1a; }

    /* —— Messages —— */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 2rem;
      scroll-behavior: smooth;
    }
    .thread {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .msg {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 1rem;
      align-items: start;
    }
    .msg.user { grid-template-columns: 1fr; justify-items: end; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10a37f, #3b82f6);
      display: grid; place-items: center;
      font-size: 0.7rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-radius: 1.25rem 1.25rem 0.35rem 1.25rem;
      padding: 0.75rem 1.1rem;
      max-width: 85%;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.assistant .bubble {
      background: transparent;
      padding: 0.15rem 0;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100%;
    }
    .msg.system {
      grid-template-columns: 1fr;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .msg.tool {
      grid-template-columns: 36px 1fr;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .msg.tool .bubble {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
    }

    /* Welcome */
    .welcome {
      max-width: 40rem;
      margin: 12vh auto 0;
      text-align: center;
      padding: 1rem;
    }
    .welcome h2 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .welcome p { color: var(--muted); margin-bottom: 1.75rem; line-height: 1.5; }
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }
    .chip {
      text-align: left;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      line-height: 1.35;
    }
    .chip:hover { border-color: var(--accent); background: #2f2f2f; }
    .chip span { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem; }

    /* Typing */
    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 0.4rem 0;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Composer */
    .composer-wrap {
      padding: 0.75rem 1rem 1.25rem;
      background: linear-gradient(transparent, var(--bg) 30%);
      flex-shrink: 0;
    }
    .composer {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid #444;
      border-radius: var(--radius);
      padding: 0.55rem 0.65rem 0.55rem 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    .composer:focus-within { border-color: #666; }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      line-height: 1.45;
      resize: none;
      max-height: 160px;
      padding: 0.35rem 0;
    }
    #input:focus { outline: none; }
    #input::placeholder { color: #777; }
    .btn-send {
      width: 36px; height: 36px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      border: 1px solid #444;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-ghost:hover { color: var(--text); border-color: #666; }
    .hint {
      text-align: center;
      font-size: 0.7rem;
      color: #666;
      margin-top: 0.55rem;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 1px solid #333;
      color: var(--text);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: transform 0.2s;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-block; }
      .chips { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">O</div>
      ORBIT
    </div>
    <button class="btn-new" id="btnNew" type="button">＋ New chat</button>

    <div class="sidebar-section">
      <label>Model</label>
      <select id="modelSelect">
        <option value="orbit-toy">orbit-toy</option>
      </select>
      <label>Temperature</label>
      <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7" />
      <span id="tempVal" style="font-size:0.75rem;color:var(--muted)">0.70</span>
      <label>Max tokens</label>
      <input type="range" id="maxTokens" min="32" max="1024" step="16" value="256" />
      <span id="maxTokVal" style="font-size:0.75rem;color:var(--muted)">256</span>
      <label>System</label>
      <textarea id="systemPrompt" rows="3">You are ORBIT — a sharp, helpful AI. Be clear, concise, and a little dry. Use tools for math, science, memory, and documents. Never claim capabilities you lack. Talk in first person as ORBIT.</textarea>
      <div class="toggle"><span>Stream replies</span><input type="checkbox" id="stream" checked /></div>
      <div class="toggle"><span>Show tool traces</span><input type="checkbox" id="showTools" /></div>
      <label>API base</label>
      <input type="text" id="apiBase" value="" placeholder="(same origin)" />
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="btnMenu" type="button">☰</button>
      <h1>ORBIT</h1>
      <span class="health" id="healthBadge">…</span>
    </div>

    <div id="messages">
      <div class="thread" id="thread">
        <div class="welcome" id="welcome">
          <h2>How can I help?</h2>
          <p>Chat, calculate, solve science problems, remember facts, or work with documents — all on your machine.</p>
          <div class="chips">
            <button type="button" class="chip" data-q="Explain RoPE in one paragraph">Explain RoPE<span>TinyLM / architecture</span></button>
            <button type="button" class="chip" data-q="derivative of x^3 * sin(x)">Derivative<span>Calculus</span></button>
            <button type="button" class="chip" data-q="100 km to m">Convert units<span>100 km → meters</span></button>
            <button type="button" class="chip" data-q="What can you do?">Capabilities<span>What ORBIT is good at</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message ORBIT…"></textarea>
        <button type="button" class="btn-ghost" id="btnAgent" title="Run tool agent">Agent</button>
        <button type="button" class="btn-ghost" id="btnStop" title="Stop generation" disabled>■</button>
        <button type="button" class="btn-send" id="btnSend" title="Send">↑</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for newline · Local API</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const thread = $("thread");
    const inputEl = $("input");
    let history = [];
    let busy = false;

    function apiBase() {
      return ($("apiBase").value.trim() || "").replace(/\/$/, "");
    }

    function hideWelcome() {
      const w = $("welcome");
      if (w) w.remove();
    }

    function addUser(text) {
      hideWelcome();
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      wrap.innerHTML = `<div class="bubble"></div>`;
      wrap.querySelector(".bubble").textContent = text;
      thread.appendChild(wrap);
      scrollBottom();
    }

    function addAssistantShell() {
      hideWelcome();
      const wrap = document.createElement("div");
      wrap.className = "msg assistant";
      wrap.innerHTML = `<div class="avatar">O</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      thread.appendChild(wrap);
      scrollBottom();
      return wrap.querySelector(".bubble");
    }

    function addSystem(text) {
      const wrap = document.createElement("div");
      wrap.className = "msg system";
      wrap.textContent = text;
      thread.appendChild(wrap);
      scrollBottom();
    }

    function addTool(text) {
      if (!$("showTools").checked) return;
      const wrap = document.createElement("div");
      wrap.className = "msg tool";
      wrap.innerHTML = `<div class="avatar" style="background:#444">⚙</div><div class="bubble"></div>`;
      wrap.querySelector(".bubble").textContent = text;
      thread.appendChild(wrap);
      scrollBottom();
    }

    function scrollBottom() {
      const el = $("messages");
      el.scrollTop = el.scrollHeight;
    }

    async function refreshHealth() {
      const badge = $("healthBadge");
      try {
        const r = await fetch(apiBase() + "/health");
        const j = await r.json();
        if (j.ok !== false && (j.status === "ok" || j.ok || j.model_loaded !== undefined || r.ok)) {
          badge.textContent = j.model_loaded
            ? "Online · model"
            : "Online · tools";
          badge.className = "health ok";
        } else {
          badge.textContent = "Unhealthy";
          badge.className = "health err";
        }
      } catch {
        badge.textContent = "Offline";
        badge.className = "health err";
      }
    }

    let activeAbort = null; // AbortController for in-flight chat request

    function setBusy(v) {
      busy = v;
      $("btnSend").disabled = v;
      const stopBtn = $("btnStop");
      if (stopBtn) stopBtn.disabled = !v;
    }

    function cancelActive() {
      if (activeAbort) {
        try { activeAbort.abort(); } catch (_) {}
        activeAbort = null;
      }
    }

    async function send(text) {
      text = (text || inputEl.value).trim();
      if (!text || busy) return;
      // Cancel any previous in-flight generation before starting a new one.
      cancelActive();
      inputEl.value = "";
      autoSize();
      addUser(text);
      history.push({ role: "user", content: text });

      const sys = $("systemPrompt").value.trim();
      const msgs = [];
      if (sys) msgs.push({ role: "system", content: sys });
      msgs.push(...history);

      const payload = {
        model: $("modelSelect").value,
        messages: msgs,
        temperature: parseFloat($("temperature").value),
        max_tokens: parseInt($("maxTokens").value, 10),
        stream: $("stream").checked,
      };

      setBusy(true);
      const bodyEl = addAssistantShell();
      let full = "";
      const ac = new AbortController();
      activeAbort = ac;

      try {
        const r = await fetch(apiBase() + "/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: ac.signal,
        });
        if (!r.ok) {
          const err = await r.text();
          throw new Error(err || r.statusText);
        }

        if (payload.stream && r.body) {
          bodyEl.innerHTML = "";
          const reader = r.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          while (true) {
            if (ac.signal.aborted) {
              try { await reader.cancel(); } catch (_) {}
              break;
            }
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop() || "";
            for (const line of lines) {
              const s = line.trim();
              if (!s.startsWith("data:")) continue;
              const data = s.slice(5).trim();
              if (data === "[DONE]") continue;
              try {
                const j = JSON.parse(data);
                const delta = j.choices?.[0]?.delta?.content || j.choices?.[0]?.text || "";
                if (delta) {
                  full += delta;
                  bodyEl.textContent = full;
                  scrollBottom();
                }
              } catch (_) {}
            }
          }
          if (!full && !ac.signal.aborted) {
            full = "(empty reply)";
            bodyEl.textContent = full;
          }
          if (ac.signal.aborted && !full) {
            full = "(cancelled)";
            bodyEl.textContent = full;
          }
        } else {
          const j = await r.json();
          full = j.choices?.[0]?.message?.content || j.choices?.[0]?.text || JSON.stringify(j);
          bodyEl.textContent = full;
        }
        if (full && full !== "(cancelled)") {
          history.push({ role: "assistant", content: full });
        }
      } catch (e) {
        if (e && e.name === "AbortError") {
          bodyEl.textContent = full || "(cancelled)";
        } else {
          bodyEl.textContent = "Something went wrong: " + (e && e.message ? e.message : String(e));
        }
      } finally {
        if (activeAbort === ac) activeAbort = null;
        setBusy(false);
        scrollBottom();
      }
    }

    function autoSize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    function newChat() {
      history = [];
      thread.innerHTML = "";
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";
      welcome.innerHTML = `
        <h2>How can I help?</h2>
        <p>Chat, calculate, solve science problems, remember facts, or work with documents — all on your machine.</p>
        <div class="chips">
          <button type="button" class="chip" data-q="Explain RoPE in one paragraph">Explain RoPE<span>TinyLM / architecture</span></button>
          <button type="button" class="chip" data-q="derivative of x^3 * sin(x)">Derivative<span>Calculus</span></button>
          <button type="button" class="chip" data-q="100 km to m">Convert units<span>100 km → meters</span></button>
          <button type="button" class="chip" data-q="What can you do?">Capabilities<span>What ORBIT is good at</span></button>
        </div>`;
      thread.appendChild(welcome);
      bindChips();
    }

    function bindChips() {
      document.querySelectorAll(".chip").forEach((btn) => {
        btn.onclick = () => send(btn.dataset.q);
      });
    }

    $("btnSend").addEventListener("click", () => send());
    $("btnStop").addEventListener("click", () => cancelActive());
    $("btnNew").addEventListener("click", () => { cancelActive(); newChat(); });
    $("btnMenu").addEventListener("click", () => $("sidebar").classList.toggle("open"));
    // Cancel in-flight generation if the user leaves the page.
    window.addEventListener("pagehide", cancelActive);
    window.addEventListener("beforeunload", cancelActive);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    inputEl.addEventListener("input", autoSize);
    $("temperature").addEventListener("input", (e) => {
      $("tempVal").textContent = parseFloat(e.target.value).toFixed(2);
    });
    $("maxTokens").addEventListener("input", (e) => {
      $("maxTokVal").textContent = e.target.value;
    });

    $("btnAgent").addEventListener("click", async () => {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      inputEl.value = "";
      autoSize();
      addUser(text);
      history.push({ role: "user", content: text });
      setBusy(true);
      const bodyEl = addAssistantShell();
      try {
        const r = await fetch(apiBase() + "/v2/agent/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, permission_level: "SAFE" }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.detail || r.status);
        const content = typeof j.content === "object" ? JSON.stringify(j.content, null, 2) : (j.content || JSON.stringify(j));
        bodyEl.textContent = content;
        if (j.observations) addTool(JSON.stringify(j.observations, null, 2));
        history.push({ role: "assistant", content: String(content) });
      } catch (e) {
        bodyEl.textContent = "Agent error: " + e.message;
      } finally {
        setBusy(false);
      }
    });

    bindChips();
    refreshHealth();
    setInterval(refreshHealth, 15000);
    inputEl.focus();
  </script>
</body>
</html>

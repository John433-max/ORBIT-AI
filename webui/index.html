<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBIT</title>
  <style>
    :root {
      --bg: #212121; --sidebar: #171717; --surface: #2f2f2f;
      --text: #ececec; --muted: #9b9b9b; --accent: #10a37f;
      --radius: 1.25rem; --font: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text);
      display: flex; height: 100vh; }
    .sidebar { width: 240px; background: var(--sidebar); padding: 1rem; border-right: 1px solid #2a2a2a; }
    .brand { font-weight: 700; margin-bottom: 1rem; }
    .main { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 720px; margin: 0 auto; width: 100%; }
    .msg { margin: 0.75rem 0; line-height: 1.5; }
    .msg.user { background: var(--surface); padding: 0.75rem 1rem; border-radius: var(--radius); }
    .msg.assistant { color: var(--text); }
    .composer { padding: 1rem; border-top: 1px solid #333; max-width: 720px; margin: 0 auto; width: 100%;
      display: flex; gap: 0.5rem; }
    #input { flex: 1; padding: 0.85rem 1rem; border-radius: var(--radius); border: 1px solid #444;
      background: var(--surface); color: var(--text); font: inherit; }
    button { background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      padding: 0.85rem 1.25rem; font: inherit; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    .muted { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">ORBIT</div>
    <p class="muted">Local agent runtime</p>
  </aside>
  <div class="main">
    <div id="messages">
      <div class="msg assistant muted">Hi — I'm ORBIT. Ask for math, code, search, or documents.</div>
    </div>
    <div class="composer">
      <input id="input" placeholder="Message ORBIT…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function add(role, text) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = text;
      messages.appendChild(d);
      messages.scrollTop = messages.scrollHeight;
    }

    async function chat() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      add('user', text);
      try {
        const r = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'orbit-toy',
            messages: [{ role: 'user', content: text }],
            stream: false,
          }),
        });
        const j = await r.json();
        const content = j.choices?.[0]?.message?.content
          || j.content
          || j.error
          || JSON.stringify(j);
        add('assistant', content);
      } catch (e) {
        add('assistant', 'Request failed: ' + e + ' — is the API running on this origin?');
      }
    }
    send.onclick = chat;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') chat(); });
  </script>
</body>
</html>
